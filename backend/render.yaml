services:
  - type: web
    name: onecase-api
    runtime: python
    branch: dev
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python migrate.py
    startCommand: python serve.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: API_HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ACCOUNTS_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: neon
      - key: STORAGE_BUCKET
        value: assets
      - key: MAX_UPLOAD_BYTES
        value: "3145728"
      - key: PUBLIC_INTAKE_OWNER_ID
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_REGION
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        sync: false
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: OneCase
