name: OneCase checks

on:
  pull_request:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onecase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      STORAGE_BACKEND: local
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-test.txt
      - name: Run backend tests
        run: .venv/bin/python -m pytest backend/tests -q

  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      STORAGE_BACKEND: local
      RATE_LIMIT_STORAGE_URI: memory://
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-test.txt
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify deployment proxy
        working-directory: frontend
        run: npm run test:proxy
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser checks with synthetic local services
        working-directory: frontend
        run: npm run test:e2e
      - name: Save test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-evidence
          path: frontend/test-results
          retention-days: 7
